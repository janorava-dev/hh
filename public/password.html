<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Změna hesla · Household Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="wrap narrow" id="root"></main>
<script src="/app.js"></script>
<script>
const root = document.getElementById("root");
let ME = null;

hh.api("/api/auth/me").then((d) => { ME = d.user; render(); }, () => (location.href = "/"));

function render() {
  root.innerHTML =
    '<div class="mark disp lg">' + hh.MARK + "Household Hero</div>" +
    '<section class="panel"><h1>Změna hesla</h1>' +
    (ME.mustChangePassword ? '<p class="cap">Máš dočasné heslo. Než budeš pokračovat, nastav si vlastní.</p>' : "") +
    '<form id="f" class="sub" style="background:none;border:0;padding:0">' +
    '<div class="field"><label for="cur">Současné heslo</label><input id="cur" type="password" autocomplete="current-password" required></div>' +
    '<div class="field"><label for="n1">Nové heslo (aspoň 8 znaků)</label><input id="n1" type="password" autocomplete="new-password" minlength="8" required></div>' +
    '<div class="field"><label for="n2">Nové heslo znovu</label><input id="n2" type="password" autocomplete="new-password" minlength="8" required></div>' +
    '<p class="err" id="err" role="alert"></p>' +
    '<button class="btn" id="go" type="submit">Uložit heslo</button></form>' +
    (ME.mustChangePassword ? "" : '<a class="cap" href="' + (hh.home(ME) || "/") + '">Zpět</a>') +
    "</section>";
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    if (n1.value !== n2.value) { err.textContent = "Nová hesla se neshodují."; return; }
    const btn = document.getElementById("go");
    btn.disabled = true;
    try {
      await hh.api("/api/auth/password", { method: "POST", body: { current: cur.value, next: n1.value } });
      location.href = hh.home(ME) || "/";
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
