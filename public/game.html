<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Hrdinské bludiště · Household Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.g{height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));gap:8px;max-width:1100px;margin:0 auto}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gh a{color:var(--ink);font-weight:800;text-decoration:none;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface)}
.gh h1{font-size:20px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.hud b{font-family:'Paytone One','Trebuchet MS',sans-serif;font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.lives{display:flex;gap:4px;min-width:60px;justify-content:flex-end}
.lives img{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);background:var(--gold-soft)}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
canvas{touch-action:none;border-radius:14px;background:#0B1120;max-width:100%;max-height:100%}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,10,20,.76);padding:12px;border-radius:14px;overflow:auto}
.ov .panel{width:min(440px,100%);text-align:center;gap:12px;justify-items:center}
.ov .big{font-family:'Paytone One','Trebuchet MS',sans-serif;font-size:44px;line-height:1}
.ov ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;width:100%;text-align:left}
.ov li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:10px;background:var(--surface-2);border:2px solid var(--line);font-weight:800}
.ov li.me{border-color:var(--gold);background:var(--gold-soft)}
.pad{display:none;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,64px);gap:6px;justify-content:center;padding-bottom:4px}
.pad button{border:2.5px solid var(--outline);background:var(--surface);border-radius:16px;display:grid;place-items:center;padding:0;touch-action:none}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad svg{width:28px;height:28px}
.pad.on{display:grid}
@media (max-width:560px){.gh h1{display:none}.g{padding-left:6px;padding-right:6px}.hud b{font-size:20px}}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
select{max-width:220px}
.mute{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:800}
</style>
</head>
<body>
<div class="g">
  <header class="gh"><a id="back" href="/">← Zpět</a><h1 class="disp">Hrdinské bludiště</h1><button class="mute" id="mute" type="button" aria-pressed="true">Zvuk</button></header>
  <div class="hud"><span>Skóre <b id="score">0</b></span><span>Level <b id="lvl">1</b></span><span class="lives" id="lives" aria-label="Životy"></span></div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="Hrací pole"></canvas><div class="ov" id="ov"><div class="panel"><p class="cap">Načítám…</p></div></div></div>
  <div class="pad" id="pad" aria-label="Ovládání">
    <button class="u" data-d="up" aria-label="Nahoru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="l" data-d="left" aria-label="Doleva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="d" data-d="down" aria-label="Dolů"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="r" data-d="right" aria-label="Doprava"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
</div>
<script src="/app.js"></script>
<script src="/hero.js"></script>
<script src="/game-core.js"></script>
<script>
(() => {
const G = HHGame, { hero, HEAD_VIEW, eqFor, lvlOf, setXPT, HEROES, esc } = HHG;
const $ = (s) => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d"), stage = $("#stage"), ov = $("#ov");
const W = 19, H = 21;
const GHOST_COLORS = ["#E5383B", "#FF8AC4", "#22C7B8", "#FFA23D"];
let T = 20, dpr = 1, walls = null, wallsLevel = 0;
let S = null;          // stav hry (HHGame)
let status = null;     // odpověď /api/game/status
let runId = null, finishing = false, paused = false, running = false;
let avatar = null, avId = 0, heroType = "knight", lastTime = 0, clock = 0;
const prefs = { speed: 1, ctrl: "swipe" };
try {
  prefs.speed = Number(localStorage.getItem("hh_game_speed")) || 1;
  prefs.ctrl = localStorage.getItem("hh_game_ctrl") === "pad" ? "pad" : "swipe";
} catch (e) {}
const savePref = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
function applyCtrl() { $("#pad").classList.toggle("on", prefs.ctrl === "pad"); resize(); }

/* ---------- zvuk ---------- */
let actx = null, soundOn = true;
try { soundOn = localStorage.getItem("hh_game_sound") !== "0"; } catch (e) {}
const muteBtn = $("#mute");
const paintMute = () => { muteBtn.textContent = soundOn ? "Zvuk zapnut" : "Zvuk vypnut"; muteBtn.setAttribute("aria-pressed", soundOn); };
paintMute();
muteBtn.onclick = () => { soundOn = !soundOn; paintMute(); try { localStorage.setItem("hh_game_sound", soundOn ? "1" : "0"); } catch (e) {} };
function beep(freq, dur, type, vol, delay) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol || 0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  dot: () => beep(520, 0.05, "square", 0.025),
  power: () => { beep(220, 0.12, "sawtooth", 0.06); beep(330, 0.12, "sawtooth", 0.06, 0.1); },
  ghost: () => { beep(600, 0.08, "square", 0.06); beep(900, 0.1, "square", 0.06, 0.08); },
  die: () => { for (let i = 0; i < 6; i++) beep(500 - i * 60, 0.12, "sawtooth", 0.06, i * 0.1); },
  clear: () => [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.14, "triangle", 0.07, i * 0.12)),
  won: () => [523, 659, 784, 1046, 1318].forEach((f, i) => beep(f, 0.18, "triangle", 0.07, i * 0.14)),
};

/* ---------- velikost a stěny ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const r = stage.getBoundingClientRect();
  T = Math.max(8, Math.floor(Math.min(r.width / W, r.height / H)));
  cv.style.width = W * T + "px"; cv.style.height = H * T + "px";
  cv.width = Math.round(W * T * dpr); cv.height = Math.round(H * T * dpr);
  walls = null;
}
function buildWalls(level) {
  const rows = G.MAZES[level - 1];
  const c = document.createElement("canvas");
  c.width = Math.round(W * T * dpr); c.height = Math.round(H * T * dpr);
  const x = c.getContext("2d");
  x.scale(dpr, dpr);
  const wall = (i, j) => j >= 0 && j < H && i >= 0 && i < W && rows[j][i] === "#";
  const fill = level === 2 ? "#3A2A6B" : "#1B2E66", edge = level === 2 ? "#9B7BFF" : "#5B7BEA";
  x.fillStyle = fill;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) if (rows[j][i] === "#") x.fillRect(i * T, j * T, T + 0.5, T + 0.5);
  x.strokeStyle = edge; x.lineWidth = Math.max(2, T * 0.09); x.lineCap = "round";
  const m = x.lineWidth / 2 + 1;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (rows[j][i] !== "#") {
      // hrana zdi směrem k prázdnému políčku
      if (wall(i - 1, j)) { x.beginPath(); x.moveTo(i * T + m, j * T - (wall(i, j - 1) ? 0 : -m)); x.lineTo(i * T + m, j * T + T + (wall(i, j + 1) ? 0 : -m)); x.stroke(); }
      if (wall(i + 1, j)) { x.beginPath(); x.moveTo(i * T + T - m, j * T + m); x.lineTo(i * T + T - m, j * T + T - m); x.stroke(); }
      if (wall(i, j - 1)) { x.beginPath(); x.moveTo(i * T + m, j * T + m); x.lineTo(i * T + T - m, j * T + m); x.stroke(); }
      if (wall(i, j + 1)) { x.beginPath(); x.moveTo(i * T + m, j * T + T - m); x.lineTo(i * T + T - m, j * T + T - m); x.stroke(); }
    }
    if (rows[j][i] === "-") { x.strokeStyle = "#FF8AC4"; x.lineWidth = Math.max(2, T * 0.14); x.beginPath(); x.moveTo(i * T, j * T + T / 2); x.lineTo(i * T + T, j * T + T / 2); x.stroke(); x.strokeStyle = edge; x.lineWidth = Math.max(2, T * 0.09); }
  }
  walls = c; wallsLevel = level;
}

/* ---------- kreslení ---------- */
const wrapDraw = (x) => (x < -0.5 ? x + W : x > W - 0.5 ? x - W : x);

function drawGhost(g) {
  const p = G.pos(g), cx = (wrapDraw(p.x) + 0.5) * T, cy = (p.y + 0.5) * T, r = T * 0.47;
  const bob = g.mode === "house" ? Math.sin(clock * 8 + g.id) * T * 0.06 : 0;
  const y = cy + bob;
  const fr = g.mode === "frightened", flash = fr && S.fright < 2 && Math.floor(clock * 5) % 2 === 0;
  if (g.mode !== "eaten") {
    ctx.fillStyle = fr ? (flash ? "#F2F2F2" : "#3346C7") : GHOST_COLORS[g.id];
    ctx.beginPath();
    ctx.arc(cx, y - r * 0.1, r, Math.PI, 0);
    ctx.lineTo(cx + r, y + r);
    for (let i = 1; i <= 6; i++) ctx.lineTo(cx + r - i * (2 * r / 6), y + r - (i % 2 ? 0.28 * r : 0));
    ctx.closePath(); ctx.fill();
  }
  const dir = g.dir ? G.D[g.dir] : [0, 0];
  if (fr && g.mode !== "eaten") {
    ctx.fillStyle = flash ? "#E5383B" : "#FFE9B0";
    ctx.beginPath(); ctx.arc(cx - r * 0.35, y - r * 0.15, r * 0.14, 0, 7); ctx.arc(cx + r * 0.35, y - r * 0.15, r * 0.14, 0, 7); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1.5, T * 0.06); ctx.beginPath();
    for (let i = 0; i <= 5; i++) { const px = cx - r * 0.55 + i * (r * 1.1 / 5), py = y + r * 0.3 + (i % 2 ? -1 : 1) * r * 0.1; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke();
  } else {
    for (const s of [-1, 1]) {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(cx + s * r * 0.36, y - r * 0.15, r * 0.27, r * 0.34, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#13203A"; ctx.beginPath(); ctx.arc(cx + s * r * 0.36 + dir[0] * r * 0.13, y - r * 0.15 + dir[1] * r * 0.15, r * 0.14, 0, 7); ctx.fill();
    }
  }
}

function drawPlayer() {
  const pl = S.player, p = G.pos(pl), cx = (wrapDraw(p.x) + 0.5) * T, cy = (p.y + 0.5) * T;
  let rad = T * 0.6, rot = 0, alpha = 1;
  if (S.mode === "dying") {
    const k = 1 - Math.max(0, S.timer) / 1.3;
    rad *= Math.max(0.05, 1 - k); rot = k * Math.PI * 4; alpha = 1 - k * 0.4;
  } else if (pl.dir) rad *= 1 + 0.05 * Math.sin(clock * 22);
  ctx.save();
  ctx.translate(cx, cy);
  if (pl.dir === "left") ctx.scale(-1, 1);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(0, 0, rad, 0, 7); ctx.closePath();
  ctx.fillStyle = "#FFF0C0"; ctx.fill();
  ctx.save(); ctx.clip();
  if (avatar && avatar.complete) ctx.drawImage(avatar, -rad, -rad, rad * 2, rad * 2);
  ctx.restore();
  ctx.lineWidth = Math.max(2, T * 0.09); ctx.strokeStyle = "#F5B300"; ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W * T, H * T);
  if (!S) return;
  if (!walls || wallsLevel !== S.level) buildWalls(S.level);
  ctx.drawImage(walls, 0, 0, W * T, H * T);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const c = S.grid[j][i];
    if (c === ".") { ctx.fillStyle = "#F6E7B4"; ctx.beginPath(); ctx.arc((i + 0.5) * T, (j + 0.5) * T, T * 0.09, 0, 7); ctx.fill(); }
    else if (c === "o") { ctx.fillStyle = "#FFD24A"; ctx.beginPath(); ctx.arc((i + 0.5) * T, (j + 0.5) * T, T * (0.23 + 0.05 * Math.sin(clock * 7)), 0, 7); ctx.fill(); }
  }
  for (const g of S.ghosts) drawGhost(g);
  drawPlayer();
  if (S.mode === "ready") {
    ctx.fillStyle = "#FFD24A"; ctx.font = `800 ${Math.floor(T * 1.1)}px 'Paytone One', sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(S.timer > 0.6 || S.level === 1 && S.score === 0 ? "Level " + S.level : "Pozor!", W * T / 2, 12 * T);
  }
  if (S.mode === "levelclear") {
    ctx.fillStyle = "rgba(11,17,32,.55)"; ctx.fillRect(0, 0, W * T, H * T);
    ctx.fillStyle = "#3DD9A8"; ctx.font = `800 ${Math.floor(T * 1.5)}px 'Paytone One', sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Level splněn!", W * T / 2, H * T / 2);
  }
}

/* ---------- HUD ---------- */
function hud() {
  $("#score").textContent = S ? S.score : 0;
  $("#lvl").textContent = S ? S.level : 1;
  const n = S ? S.lives : 0, box = $("#lives");
  const key = n + ":" + (avatar ? avatar.dataset.id : "");
  if (box.dataset.n !== key) {
    box.dataset.n = key;
    box.innerHTML = Array.from({ length: n }, () => `<img src="${avatarSrc()}" alt="">`).join("");
  }
}
const avatarSrc = () => (avatar ? avatar.src : "");

/* ---------- hlavní smyčka ---------- */
function tick(dt) {
  clock += dt;
  if (S && running && !paused) {
    G.update(S, dt);
    for (const e of S.events) {
      if (e === "dot") sfx.dot(); else if (e === "power") sfx.power(); else if (e === "ghost") sfx.ghost();
      else if (e === "die") { sfx.die(); try { navigator.vibrate && navigator.vibrate(150); } catch (x) {} }
      else if (e === "clear") sfx.clear(); else if (e === "won") sfx.won();
    }
    S.events.length = 0;
    if ((S.mode === "over" || S.mode === "won") && !finishing) finish();
  }
}
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
  lastTime = now;
  tick(dt);
  draw(); hud();
  requestAnimationFrame(frame);
}
// pro ruční ověření v prohlížeči (skrytá záložka nespouští animační snímky): /game?debug
if (/[?&]debug/.test(location.search)) {
  window.__g = { get S() { return S; }, step(sec) { for (let i = 0; i < sec * 60; i++) tick(1 / 60); draw(); hud(); }, setPaused(v) { paused = v; } };
}

/* ---------- ovládání ---------- */
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
document.addEventListener("keydown", (e) => {
  const d = KEYS[e.key];
  if (d && S && running) { e.preventDefault(); G.setInput(S, d); }
  if (e.key === " " && running) { e.preventDefault(); togglePause(); }
});
const stick = G.makeStick({ threshold: 9, radius: 30 });
const touchPos = (e) => { const t = e.touches[0] || e.changedTouches[0]; return [t.clientX, t.clientY]; };
stage.addEventListener("touchstart", (e) => { if (e.target.closest(".ov")) return; const p = touchPos(e); stick.start(p[0], p[1]); e.preventDefault(); }, { passive: false });
stage.addEventListener("touchmove", (e) => {
  const p = touchPos(e), d = stick.move(p[0], p[1]);
  if (d && S && running && !paused) G.setInput(S, d);
  e.preventDefault();
}, { passive: false });
stage.addEventListener("touchend", () => stick.end());
stage.addEventListener("touchcancel", () => stick.end());
document.querySelectorAll(".pad button").forEach((b) => {
  const go = (e) => { e.preventDefault(); if (S && running) G.setInput(S, b.dataset.d); };
  b.addEventListener("pointerdown", go);
});
document.addEventListener("visibilitychange", () => { if (document.hidden && running && S && S.mode !== "over" && S.mode !== "won") pause(true); });
window.addEventListener("resize", () => { resize(); });
window.addEventListener("orientationchange", () => setTimeout(resize, 200));

function pause(on) {
  paused = on;
  if (on) ov.hidden = false, showPause(); else ov.hidden = true;
}
const togglePause = () => pause(!paused);
function showPause() {
  ov.innerHTML = `<div class="panel"><h2>Pauza</h2><button class="btn" id="resume">Pokračovat</button></div>`;
  $("#resume").onclick = () => pause(false);
}

/* ---------- avatar ---------- */
function makeAvatar(type, xp, equipment) {
  const L = lvlOf(xp || 0);
  const svg = hero(type, L, eqFor({ eq: equipment || {} }, L), HEAD_VIEW);
  const img = new Image();
  img.dataset.id = String(++avId);
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  return img;
}

/* ---------- průběh: menu, start, konec ---------- */
async function load() {
  try {
    const me = (await hh.api("/api/auth/me")).user;
    $("#back").href = hh.home(me) || "/";
    status = await hh.api("/api/game/status");
    setXPT(status.levels);
  } catch (e) {
    if (e.status === 401) { location.href = "/"; return; }
    ov.innerHTML = `<div class="panel"><p class="cap">${esc(e.message)}</p></div>`;
    return;
  }
  if (status.hero) { heroType = status.hero.hero; avatar = makeAvatar(heroType, status.hero.xp, status.hero.equipment); }
  else {
    try { heroType = localStorage.getItem("hh_game_hero") || "knight"; } catch (e) {}
    if (!HEROES[heroType]) heroType = "knight";
    avatar = makeAvatar(heroType, 2340, {});
  }
  S = G.createGame();
  showMenu();
}

function board(list) {
  if (!list || !list.length) return "";
  return `<ul aria-label="Nejlepší skóre">${list.map((x) => `<li class="${x.me ? "me" : ""}"><span>${esc(x.name)}${x.me ? " (ty)" : ""}</span><b>${x.best}</b></li>`).join("")}</ul>`;
}

function showMenu(result) {
  running = false; paused = false; finishing = false;
  const p = status.plays;
  let body = "";
  if (result) {
    body += `<div class="eyebrow">Konec hry</div><div class="big">${result.score}</div><p>${result.won ? "Prošel(a) jsi všechny levely!" : "Level " + result.level}${result.isBest ? " · Nový rekord!" : ""}</p>`;
  } else {
    body += `<div class="eyebrow">Hrdinské bludiště</div><h2>Seber všechny tečky a nenech se chytit duchy</h2><p class="cap">Táhni prstem kamkoli po hracím poli, nemusíš ho zvedat. Nebo mačkej šipky. Velká tečka z duchů udělá kořist. Máš 3 životy a 3 levely.</p>`;
  }
  let canPlay = false;
  if (status.unlimited) {
    canPlay = true;
    const opts = Object.keys(HEROES).map((k) => `<option value="${k}"${k === heroType ? " selected" : ""}>${esc(HEROES[k].name)}</option>`).join("");
    body += `<p class="cap">Hraješ bez omezení počtu spuštění.</p><div class="opts"><label for="hsel">Postava</label><select id="hsel">${opts}</select></div>`;
  } else if (p.locked) {
    body += `<p><b>Dnes je Den regenerace.</b> Hra je zamčená, zítra zase.</p>`;
  } else if (p.available > 0) {
    canPlay = true;
    body += `<p><b>Máš ${p.available} ${p.available === 1 ? "spuštění" : p.available < 5 ? "spuštění" : "spuštění"}.</b> Jedno se spotřebuje po klepnutí na Hrát.</p>`;
  } else {
    body += `<p><b>Dnes už nemáš žádné spuštění.</b></p><p class="cap">${p.tomorrow > 0 ? `Zítra ti přibude ${p.tomorrow} ${p.tomorrow === 1 ? "spuštění" : "spuštění"}.` : "Spuštění získáš třeba splněním večerní mise. Dostaneš ho pak další den."}</p>`;
  }
  const so = (v, t) => `<option value="${v}"${prefs.speed === v ? " selected" : ""}>${t}</option>`;
  const co = (v, t) => `<option value="${v}"${prefs.ctrl === v ? " selected" : ""}>${t}</option>`;
  body += `<div class="opts"><label for="tempo">Tempo</label><select id="tempo">${so(0.8, "Pomalé")}${so(1, "Střední")}${so(1.25, "Rychlé")}</select><label for="ctrl">Ovládání</label><select id="ctrl">${co("swipe", "Tažení prstem")}${co("pad", "Šipky")}</select></div>`;
  body += `<p class="cap">Tvůj rekord: <b>${status.best}</b></p>${board(status.scores)}`;
  body += `<div class="opts">${canPlay ? `<button class="btn" id="play">${result ? "Hrát znovu" : "Hrát"}</button>` : ""}<a class="btn ghost" href="${$("#back").href}">Zpět do aplikace</a></div>`;
  ov.hidden = false;
  ov.innerHTML = `<div class="panel">${body}</div>`;
  const hs = $("#hsel");
  if (hs) hs.onchange = () => { heroType = hs.value; try { localStorage.setItem("hh_game_hero", heroType); } catch (e) {} avatar = makeAvatar(heroType, 2340, {}); };
  const tp = $("#tempo"), cs = $("#ctrl");
  if (tp) tp.onchange = () => { prefs.speed = Number(tp.value); savePref("hh_game_speed", prefs.speed); };
  if (cs) cs.onchange = () => { prefs.ctrl = cs.value; savePref("hh_game_ctrl", prefs.ctrl); applyCtrl(); };
  const pb = $("#play");
  if (pb) pb.onclick = start;
}

async function start() {
  const pb = $("#play");
  if (pb) pb.disabled = true;
  try {
    const r = await hh.api("/api/game/start", { method: "POST", body: {} });
    runId = r.runId;
    if (r.plays) status.plays = r.plays;
  } catch (e) {
    hh.toast(e.message, true);
    try { status = await hh.api("/api/game/status"); } catch (x) {}
    showMenu();
    return;
  }
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch (e) {}
  S = G.createGame({ speed: prefs.speed });
  walls = null; finishing = false; paused = false; running = true;
  ov.hidden = true;
}

async function finish() {
  finishing = true; running = false;
  const won = S.mode === "won", level = S.level, score = S.score;
  let res = { score, level, won, isBest: false };
  try {
    const r = await hh.api("/api/game/finish", { method: "POST", body: { runId, score, level, won } });
    res = { score: r.score, level, won, isBest: r.isBest };
    status.best = r.best; status.scores = r.scores; if (r.plays) status.plays = r.plays;
  } catch (e) { hh.toast(e.message, true); }
  setTimeout(() => showMenu(res), 900);
}

applyCtrl();
requestAnimationFrame(frame);
load();
})();
</script>
</body>
</html>
