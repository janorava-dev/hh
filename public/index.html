<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Household Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="wrap narrow">
  <div class="mark disp lg" id="mark"></div>
  <section class="panel" id="card">
    <h1>Přihlášení</h1>
    <form id="login" class="sub" style="background:none;border:0;padding:0" autocomplete="on">
      <div class="field"><label for="u">Uživatelské jméno</label><input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="p">Heslo</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="go" type="submit">Přihlásit</button>
    </form>
    <p class="cap">Účty zakládá správce aplikace. Nemáš-li účet, požádej o něj.</p>
  </section>
</main>
<script src="/app.js"></script>
<script>
document.getElementById("mark").innerHTML = hh.MARK + "Household Hero";
const err = document.getElementById("err");

function go(u) {
  if (u.mustChangePassword) { location.href = "/password"; return; }
  const h = hh.home(u);
  if (h) { location.href = h; return; }
  document.getElementById("card").innerHTML =
    '<h1>Skoro hotovo</h1><p>Tvůj účet zatím není přiřazený do žádné rodiny. Požádej správce, ať tě připojí.</p>' +
    '<button class="btn ghost" type="button" data-logout>Odhlásit</button>';
}

hh.api("/api/auth/me").then((d) => go(d.user), () => {});

document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "";
  const btn = document.getElementById("go");
  btn.disabled = true;
  try {
    const d = await hh.api("/api/auth/login", { method: "POST", body: { username: u.value, password: p.value } });
    go(d.user);
  } catch (ex) {
    err.textContent = ex.message;
    btn.disabled = false;
    p.select();
  }
});
</script>
</body>
</html>
