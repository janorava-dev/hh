<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Household Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EEF7; --surface:#FFFFFF; --surface-2:#F0F5FB; --ink:#13203A; --ink-2:#4A5C7C; --line:#CBD8E8;
  --outline:#13203A; --pop:#13203A;
  --accent:#2F5BEA; --accent-ink:#FFFFFF;
  --gold:#F5B300; --gold-soft:#FFF0C0; --ray:#FFE8A6;
  --ok:#0E9F78; --ok-soft:#D8F5EC; --on-ok:#FFFFFF;
  --bad:#E23B4A; --bad-soft:#FDE3E5;
  --shadow:4px 4px 0 var(--pop);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1526; --surface:#16233D; --surface-2:#1D2D4C; --ink:#EAF0FB; --ink-2:#9DB0D0; --line:#2B3E62;
    --outline:#3A4F7C; --pop:#050A14;
    --accent:#6C8CFF; --accent-ink:#0D1526;
    --gold:#FFC93C; --gold-soft:#3A3011; --ray:#22345C;
    --ok:#3DD9A8; --ok-soft:#123A33; --on-ok:#062B22;
    --bad:#FF6673; --bad-soft:#40202A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1526; --surface:#16233D; --surface-2:#1D2D4C; --ink:#EAF0FB; --ink-2:#9DB0D0; --line:#2B3E62;
  --outline:#3A4F7C; --pop:#050A14;
  --accent:#6C8CFF; --accent-ink:#0D1526;
  --gold:#FFC93C; --gold-soft:#3A3011; --ray:#22345C;
  --ok:#3DD9A8; --ok-soft:#123A33; --on-ok:#062B22;
  --bad:#FF6673; --bad-soft:#40202A;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:600 15px/1.4 'Nunito','Trebuchet MS',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:'Paytone One','Trebuchet MS',system-ui,sans-serif;font-weight:400;letter-spacing:.2px;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cap{font-size:13px;color:var(--ink-2);font-weight:700}
.cap.tom{display:flex;align-items:center;gap:6px;color:var(--ink);padding-top:6px;border-top:2px dashed var(--line)}
.cap.tom .ic{width:16px;height:16px}

.app{max-width:480px;margin:0 auto;padding:14px 16px 122px;display:grid;gap:18px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{display:flex;align-items:center;gap:8px;font-size:21px;line-height:1}
.mark svg{width:26px;height:30px}
.who{display:flex;gap:8px;align-items:center}
.kid{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--outline);background:var(--surface);padding:0;overflow:hidden}
.kid svg{width:100%;height:100%;display:block}
.kid[aria-pressed="true"]{background:var(--gold);box-shadow:3px 3px 0 var(--pop)}
.parent-btn{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:2.5px solid var(--outline);border-radius:14px;background:var(--surface);font-weight:800;font-size:13px}

/* surfaces */
.panel{background:var(--surface);border:2.5px solid var(--outline);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.flat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:2.5px solid var(--outline);border-radius:18px;padding:14px;display:grid;gap:8px;align-content:start}

/* hero card */
.herocard{display:grid;grid-template-columns:128px 1fr;gap:14px;align-items:center}
.stage{position:relative;width:100%;max-width:100%}
.stage::before{content:"";position:absolute;inset:-8px;background:repeating-conic-gradient(var(--ray) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 38%,transparent 68%);mask:radial-gradient(circle,#000 38%,transparent 68%)}
.stage svg{position:relative;display:block;width:100%;height:auto}
.stage.lg{width:190px;margin:0 auto}
.hname{font-size:30px;line-height:1.05;margin:2px 0 8px}
.xpbar{height:16px;border:2.5px solid var(--outline);border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.xpl{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;color:var(--ink-2);margin-top:5px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px 5px 8px;border-radius:99px;background:var(--gold-soft);border:2px solid var(--gold);font-size:13px;font-weight:800}
.streak .ic{width:18px;height:18px;color:var(--gold);fill:var(--gold)}

/* wallet + shield */
.big{font-family:'Paytone One','Trebuchet MS',sans-serif;font-size:48px;line-height:1}
.big small{font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;color:var(--ink-2)}
.lockbig{display:flex;align-items:center;gap:8px;font-family:'Paytone One',sans-serif;font-size:26px;line-height:1.1;color:var(--bad);min-height:48px}
.lockbig .ic{width:30px;height:30px}
.bar{height:14px;border:2.5px solid var(--outline);border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar .ok{background:var(--ok)}
.bar .pend{background:repeating-linear-gradient(45deg,var(--gold) 0 5px,transparent 5px 10px)}
.shields{display:flex;gap:6px;min-height:48px;align-items:center}
.sh{width:38px;height:44px}
.sh .sf{fill:var(--accent);stroke:var(--outline);stroke-width:2.5;stroke-linejoin:round}
.sh .ss{fill:var(--gold);stroke:var(--outline);stroke-width:1.6;stroke-linejoin:round}
.sh.cr .sf{fill:var(--bad-soft);stroke:var(--bad)}
.sh .sc{fill:none;stroke:var(--bad);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* banners */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:18px;border:2.5px solid var(--bad);background:var(--bad-soft)}
.alert .ic{width:26px;height:26px;color:var(--bad);margin-top:2px}
.alert h3{font-size:20px;margin-bottom:2px}
.alert p{font-size:14px}

/* missions */
.mhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mhead h2{font-size:26px;line-height:1.1}
.reward{display:grid;justify-items:end;gap:2px;font-weight:800;font-size:13px;white-space:nowrap}
.reward b{font-family:'Paytone One',sans-serif;font-weight:400;font-size:22px;color:var(--ok)}
.steps{display:flex;align-items:center;gap:10px;margin:12px 0}
.steps .bar{flex:1}
.steps .ok{background:var(--ok)}
.steps span{font-weight:800;font-variant-numeric:tabular-nums}
.tasks{display:grid;gap:8px}
.task{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px 8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:left}
.task .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--ink-2);flex:none}
.task .lbl{flex:1;font-weight:800;line-height:1.25}
.task .chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--outline);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent}
.task .chk .ic{width:18px;height:18px;stroke-width:3.2}
.task.is-done{background:var(--ok-soft);border-color:var(--ok)}
.task.is-done .chk{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.task:disabled{cursor:default}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center}
.status.pend{background:var(--gold-soft);border:2px dashed var(--gold)}
.status.ok{background:var(--ok-soft);border:2px solid var(--ok)}

/* bonus */
.bonus{display:flex;align-items:center;gap:12px}
.bonus .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);color:var(--ink-2);flex:none}
.bonus .txt{flex:1;display:grid;gap:1px;min-width:0}
.bonus b{font-weight:800}
.bonus small{font-size:12px;font-weight:800;color:var(--ink-2)}
.btn{border:2.5px solid var(--outline);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 14px;font-weight:800;box-shadow:3px 3px 0 var(--pop);white-space:nowrap}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.tag{padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap;border:2px solid var(--line);background:var(--surface-2)}
.tag.pend{background:var(--gold-soft);border-color:var(--gold)}
.tag.ok{background:var(--ok-soft);border-color:var(--ok)}

/* hero tab */
.center{display:grid;justify-items:center;gap:10px;text-align:center}
.nameinp{width:100%;max-width:260px;text-align:center;font-family:'Paytone One',sans-serif;font-size:30px;background:transparent;border:0;border-bottom:3px dashed var(--line);padding:2px 4px;color:var(--ink)}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.step{display:grid;justify-items:center;gap:4px;text-align:center;font-size:12px;font-weight:800;padding:8px 4px;border-radius:14px;border:2px solid transparent}
.step svg{width:100%;height:auto;max-width:78px}
.step.now{border-color:var(--accent);background:var(--surface-2)}
.step.ghost svg{filter:brightness(0);opacity:.2}
.step small{color:var(--ink-2);font-weight:700}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{display:grid;justify-items:center;gap:2px;padding:8px 4px 8px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface-2);font-weight:800;font-size:13px}
.pick svg{width:78%;height:auto}
.pick[aria-pressed="true"]{border-color:var(--outline);background:var(--gold-soft);box-shadow:3px 3px 0 var(--pop)}
.slot{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line)}
.slot .sl-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot.locked{color:var(--ink-2);grid-template-columns:auto 1fr;align-items:center}
.slot.locked span{font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:13px}
.opt i{width:14px;height:14px;border-radius:50%;border:2px solid var(--outline)}
.opt[aria-pressed="true"]{border-color:var(--outline);background:var(--gold-soft)}

/* team tab */
.rank{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.rank .kid{cursor:default}
.rank .bar{margin-top:5px}
.rank .bar .ok{background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;font-size:12px;font-weight:800;line-height:1.2}
.badge svg{width:52px;height:52px}
.badge.off{color:var(--ink-2)}
.badge.off .bg{fill:var(--surface-2);stroke:var(--line)}
.badge .bg{fill:var(--gold);stroke:var(--outline);stroke-width:2.5}
.badge .st{fill:var(--surface);stroke:var(--outline);stroke-width:2}
.badge.off .st{fill:var(--line);stroke:var(--line)}

/* nav, sheet, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:10}
.tabs .in{pointer-events:auto;display:flex;width:100%;max-width:448px;background:var(--surface);border:2.5px solid var(--outline);border-radius:20px;box-shadow:var(--shadow);padding:6px;gap:4px}
.tab{flex:1;display:grid;justify-items:center;gap:2px;padding:7px 4px;border:0;background:none;border-radius:14px;font-size:12px;font-weight:800;color:var(--ink-2)}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:480px;max-height:88%;overflow:auto;background:var(--surface);border:2.5px solid var(--outline);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.sheet h2{font-size:24px}
.sheet .note{font-size:13px;color:var(--ink-2);font-weight:700;background:var(--surface-2);border:2px dashed var(--line);border-radius:12px;padding:9px 11px}
.sheet .sec{display:grid;gap:8px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;border:2px solid var(--bad);background:var(--bad-soft);font-weight:800;font-size:13px}
.chip:disabled{opacity:.4;cursor:not-allowed}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--outline);background:var(--surface);display:grid;place-items:center;padding:0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(440px,calc(100% - 32px));padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:800;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:360px){.herocard{grid-template-columns:104px 1fr}.hname{font-size:26px}.big{font-size:40px}}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--outline);display:block}
.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}.dot.now{background:var(--gold)}
.qtext{font-family:'Paytone One','Trebuchet MS',sans-serif;font-size:clamp(26px,9vw,40px);line-height:1.2;text-align:center;padding:12px 2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.qtext.long{font-family:'Nunito',sans-serif;font-weight:800;font-size:19px;line-height:1.4;text-align:left}
.ans{width:100%;height:68px;font-size:32px;text-align:center;font-weight:800;border:3px solid var(--outline);border-radius:16px;background:var(--surface);color:var(--ink)}
.ans:focus{border-color:var(--accent)}
.fb{padding:12px;border-radius:14px;font-weight:800;text-align:center;font-size:18px}
.fb.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:2px solid var(--bad)}
.stat{display:flex;flex-wrap:wrap;gap:6px}
.hrow{display:grid;grid-template-columns:70px 1fr 64px 92px;gap:8px;align-items:center;font-size:13px}
.hd{font-weight:800}
body{margin:0}
</style>
</head>
<body>
<div id="hhbar" style="position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 16px;background:var(--ink);color:var(--bg);font:800 12px/1.3 Nunito,system-ui,sans-serif"><span id="hhwho">Household Hero</span><button data-logout style="all:unset;cursor:pointer;text-decoration:underline">Odhlásit</button></div>
<div class="app" id="app"><p class="cap">Načítám…</p></div>
<nav class="tabs" id="tabs" aria-label="Hlavní menu"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/hero.js"></script>
<script>
(()=>{
const {XPT,FORMS,lvlOf,tierOf,SLOTS,HEROES,hero,HEAD_VIEW,eqFor,ic,shield,esc,dny}=HHG;
const $=s=>document.querySelector(s);
const MIN_M=30,XP_M=40,CAP=60;
const MISSIONS=[['bed','V posteli do 20:30'],['tooth','Vyčištěné zuby'],['desk','Uklizený stůl'],['bag','Věci do školy připravené'],['door','Nic dětského mimo pokojík']];
const choreIc=l=>/koš|odpad/i.test(l)?'bin':/myčk|nádob|umýt|umyt/i.test(l)?'dish':/prád|oblečen/i.test(l)?'shirt':'check';
const S={tab:'home',g:null,fk:null};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000)}

function kid(){const st=S.g.state;return{name:st.hero.name||S.g.displayName,hero:st.hero.hero,xp:st.xp,eq:st.hero.equipment,streak:st.streak}}

function topView(){
  return `<header class="top"><div class="mark disp"><svg viewBox="0 0 32 36" aria-hidden="true"><path d="M16 1 30 6v11c0 9-6 15-14 18C8 32 2 26 2 17V6z" fill="var(--accent)" stroke="var(--outline)" stroke-width="2.5" stroke-linejoin="round"/><path d="M11 10v16M21 10v16M11 18h10" stroke="var(--accent-ink)" stroke-width="3.5" stroke-linecap="round"/></svg>Household Hero</div>
  <span class="tag">${esc(S.g.familyName)}</span></header>`;
}
function homeView(k,st){
  const L=lvlOf(k.xp),tier=tierOf(L),n=st.strikes.length,broken=n>=3;
  const span=L>=10?1:XPT[L]-XPT[L-1],cur=L>=10?1:k.xp-XPT[L-1],toNext=L>=10?0:XPT[L]-k.xp;
  const m=st.mission,done=m.items.filter(Boolean).length,locked=m.status!=='open';
  let h='';
  h+=`<section class="panel herocard"><div class="stage">${hero(k.hero,L,eqFor(k,L))}</div><div>
    <div class="eyebrow">${FORMS[tier-1]} · Level ${L}</div><h1 class="hname">${esc(k.name)}</h1>
    <div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="${span}" aria-valuenow="${cur}"><i style="width:${Math.round(cur/span*100)}%"></i></div>
    <div class="xpl"><span>${cur} / ${span} XP</span><span>${L>=10?'Nejvyšší level':`ještě ${toNext} do levelu ${L+1}`}</span></div>
    <div class="cap" style="margin-top:6px">Celkem ${k.xp} XP</div>
    <div class="streak">${ic('flame')}${k.streak} ${dny(k.streak)} v řadě</div></div></section>`;
  if(st.regen) h+=`<section class="alert">${ic('lock')}<div><h3>Den regenerace</h3><p>Štít se včera rozbil. Dnes se nehraje – tvoje minuty se přesunou na zítra. Mise ti dál dají XP a sérii.</p></div></section>`;
  else if(broken) h+=`<section class="alert">${ic('lock')}<div><h3>Štít se rozbil</h3><p>Zítra je Den regenerace: žádné hraní. Minuty se nepropadnou, přesunou se na den poté.</p></div></section>`;
  h+=`<div class="duo"><section class="tile"><div class="eyebrow">Herní čas dnes</div>
    ${st.regen?`<div class="lockbig">${ic('lock')}Zamčeno</div>`:`<div class="big">${st.usable}<small> min</small></div>`}
    <div class="bar" aria-hidden="true">${st.regen?'':`<i class="ok" style="width:${Math.min(100,st.usable/Math.max(CAP,st.usable)*100)}%"></i>`}</div>
    <p class="cap">${st.regen?'Dnes bez hraní':st.carry?`z toho ${st.carry} min přeneseno`:'vyděláno včera'}</p>
    <p class="cap tom">${ic('clock')}Zítra ${st.tomorrow} min${st.tomorrowPending?` (+${st.tomorrowPending} čeká)`:''}</p></section>
   <section class="tile"><div class="eyebrow">Štít hrdiny</div>
    <div class="shields" role="img" aria-label="${n} ze 3 trhlin štítu">${[0,1,2].map(i=>shield(i<n)).join('')}</div>
    <p class="cap">${n?`${n} z 3 trhlin · ${esc(st.strikes[n-1].reason)}`:'Štít je celý'}</p></section></div>`;
  if(!st.regen&&!broken) h+=`<p class="cap" style="margin-top:-6px">Tři trhliny za den = zítra Den regenerace bez hraní.</p>`;
  const ar=S.g.arcade;
  h+=`<section class="flat"><div class="eyebrow">Hrdinské bludiště</div><div class="bonus"><span class="ico">${ic('play')}</span><div class="txt"><b>${ar.locked?'Dnes zamčeno (Den regenerace)':ar.available>0?`Máš ${ar.available} spuštění`:'Dnes žádné spuštění'}</b><small>${ar.tomorrow>0?`Zítra ti přibude ${ar.tomorrow} za dnešní misi`:'Spuštění získáš třeba večerní misí (platí další den)'}</small></div>${ar.available>0&&!ar.locked?'<a class="btn sm" href="/game">Hrát</a>':'<a class="btn ghost sm" href="/game">Otevřít</a>'}</div></section>`;
  h+=`<section class="panel"><div class="mhead"><div><div class="eyebrow">Večerní mise · do 20:30</div><h2>Připrav se na noc</h2></div>
    <div class="reward"><b>+${MIN_M} min</b><span>na zítra · +${XP_M} XP</span></div></div>
    <div class="steps"><div class="bar" aria-hidden="true"><i class="ok" style="width:${done/5*100}%"></i></div><span>${done}/5</span></div>
    <div class="tasks">${MISSIONS.map((mi,i)=>`<button class="task ${m.items[i]?'is-done':''}" data-act="tick" data-v="${i}" aria-pressed="${!!m.items[i]}" ${locked?'disabled':''}><span class="ico">${ic(mi[0])}</span><span class="lbl">${mi[1]}</span><span class="chk">${ic('check')}</span></button>`).join('')}</div>
    ${m.status==='pending'?`<div class="status pend">${ic('clock')}Odesláno rodičům – čeká na schválení</div>`:''}
    ${m.status==='approved'?`<div class="status ok">${ic('check')}Schváleno · +${MIN_M} min na zítra a +${XP_M} XP</div>`:''}</section>`;
  h+=`<section class="flat"><div class="eyebrow">Bonusové úkoly</div>${st.bonus.length?st.bonus.map(b=>
    `<div class="bonus"><span class="ico">${ic(choreIc(b.label))}</span><div class="txt"><b>${esc(b.label)}</b><small>+${b.minutes} min · +${b.xp} XP</small></div>
    ${b.status==='open'?`<button class="btn sm" data-act="bonus" data-v="${b.id}">Hotovo</button>`:b.status==='pending'?`<span class="tag pend">Čeká na rodiče</span>`:`<span class="tag ok">Splněno</span>`}</div>`).join(''):'<p class="cap">Rodiče zatím žádné bonusové úkoly nepřidali.</p>'}
    <p class="cap">Minuty z bonusů se připíšou na zítra.</p></section>`;
  return h;
}
function heroView(k,st){
  const L=lvlOf(k.xp),tier=tierOf(L),span=L>=10?1:XPT[L]-XPT[L-1],cur=L>=10?1:k.xp-XPT[L-1];
  let h=`<section class="panel center"><div class="stage lg">${hero(k.hero,L,eqFor(k,L))}</div>
    <input id="nm" class="nameinp" value="${esc(k.name)}" maxlength="14" aria-label="Hrdinské jméno" autocomplete="off">
    <div class="eyebrow">${FORMS[tier-1]} · Level ${L}</div>
    <div class="cap">Celkem ${k.xp} XP</div>
    <div style="width:100%"><div class="xpbar"><i style="width:${Math.round(cur/span*100)}%"></i></div><div class="xpl"><span>${cur} / ${span} XP</span><span>${L>=10?'Nejvyšší level':`do levelu ${L+1}: ${XPT[L]-k.xp} XP`}</span></div></div></section>`;
  h+=`<section class="flat"><div class="eyebrow">Cesta hrdiny</div><div class="path">${[1,3,6,10].map((lv,i)=>`<div class="step ${lv>L?'ghost':''} ${tier===i+1?'now':''}">${hero(k.hero,lv,eqFor(k,lv))}<span>${FORMS[i]}<br><small>Level ${lv}</small></span></div>`).join('')}</div></section>`;
  h+=`<section class="flat"><div class="eyebrow">Výbava · XP se neutrácí, jen odemyká</div>${SLOTS.map(sl=>{
    if(L<sl.lvl) return `<div class="slot locked">${ic('lock')}<div><b>${sl.name}</b><br><span>Odemkne se na levelu ${sl.lvl} · zbývá ${XPT[sl.lvl-1]-k.xp} XP</span></div></div>`;
    return `<div class="slot"><div class="sl-h"><b>${sl.name}</b><span class="cap">Level ${sl.lvl}</span></div><div class="opts">${sl.opts.map(o=>`<button class="opt" data-act="equip" data-v="${sl.id}:${o[0]}" aria-pressed="${k.eq[sl.id]===o[0]}"><i style="background:${o[2]}"></i>${o[1]}</button>`).join('')}</div></div>`}).join('')}</section>`;
  h+=`<section class="flat"><div class="eyebrow">Vyber hrdinu · level a výbava zůstanou</div><div class="picks">${Object.keys(HEROES).map(t=>`<button class="pick" data-act="pick" data-v="${t}" aria-pressed="${k.hero===t}">${hero(t,1,{})}<span>${HEROES[t].name}</span></button>`).join('')}</div></section>`;
  return h;
}
function teamView(k,st){
  const all=[{name:k.name,hero:k.hero,eq:k.eq,xp:k.xp,me:true},...S.g.siblings.map(s=>({name:s.name||s.displayName,hero:s.hero,eq:s.equipment,xp:s.xp}))];
  const mx=Math.max(...all.map(x=>x.xp),1);
  return `<section class="panel"><div class="eyebrow">Družina</div><h2 style="font-size:26px;margin:2px 0 10px">${esc(S.g.familyName)}</h2><p class="cap">Tenhle týden jsi nasbíral(a) ${st.weekXp} XP.</p></section>
  <section class="flat"><div class="eyebrow">XP celkem</div>${all.map(x=>`<div class="rank"><span class="kid" style="display:block">${hero(x.hero,lvlOf(x.xp),eqFor(x,lvlOf(x.xp)),HEAD_VIEW)}</span><div><b>${esc(x.name)}${x.me?' (ty)':''}</b> <span class="cap">Level ${lvlOf(x.xp)}</span><div class="bar"><i class="ok" style="width:${x.xp/mx*100}%"></i></div></div><b style="font-variant-numeric:tabular-nums">${x.xp}</b></div>`).join('')}
    <p class="cap">Soutěží se spolu, ne proti sobě.</p></section>`;
}
/* ---------- trénink počítání ---------- */
const T={phase:'menu',status:null,session:null,idx:0,fb:null,summary:null,loading:false,err:null};
const trBusy=()=>S.tab==='train'&&(T.phase==='q'||T.phase==='fb');
let trTimer;

function trainView(){
  if(T.loading&&!T.status)return `<section class="panel"><p class="cap">Načítám…</p></section>`;
  if(!T.status)return `<section class="panel"><p class="cap">${esc(T.err||'Trénink se nepodařilo načíst.')}</p></section>`;
  const st=T.status;
  if(st.needsBirthYear)return `<section class="panel"><div class="eyebrow">Trénink</div><h2>Počítání</h2><p>Rodič ještě nevyplnil tvůj rok narození. Podle něj se vybírají příklady, které ti sedí.</p></section>`;
  const used=st.minutesToday,cap=st.minutesCap,need=Math.ceil(st.questions*0.8);
  const head=`<section class="panel"><div class="eyebrow">Trénink · ${st.grade}. třída</div><h2>Počítání</h2>
    <div class="steps"><div class="bar" aria-hidden="true"><i class="ok" style="width:${Math.min(100,used/cap*100)}%"></i></div><span>${used}/${cap} min</span></div>
    <p class="cap">${st.questions} příkladů v sadě. Aspoň ${need} správně = +${st.minutesPerSession} min na zítra a +${st.xpPerSession} XP. Minut z tréninku je za den nejvýš ${cap}, XP můžeš sbírat dál.</p></section>`;
  const qcls=t=>'qtext'+(t.length>38?' long':'');
  if(T.phase==='q'&&T.session){
    const s=T.session,i=T.idx;
    return `<section class="panel"><div class="qh"><div class="eyebrow">Příklad ${i+1} z ${s.total}</div><div class="dots" aria-hidden="true">${s.questions.map((_,j)=>{const r=s.results[j];return `<i class="dot ${r?(r.ok?'ok':'no'):j===i?'now':''}"></i>`}).join('')}</div></div>
      <div class="${qcls(s.questions[i])}">${esc(s.questions[i])}</div>
      <input id="ans" class="ans" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Tvoje odpověď">
      <button class="btn" data-act="tra" data-v="1">Odpovědět</button></section>`;
  }
  if(T.phase==='fb'&&T.session&&T.fb){
    const s=T.session,f=T.fb,i=T.idx;
    return `<section class="panel"><div class="qh"><div class="eyebrow">Příklad ${i+1} z ${s.total}</div><div class="dots" aria-hidden="true">${s.questions.map((_,j)=>{const r=s.results[j];return `<i class="dot ${r?(r.ok?'ok':'no'):''}"></i>`}).join('')}</div></div>
      <div class="${qcls(s.questions[i])}">${esc(s.questions[i])}</div>
      <div class="fb ${f.ok?'ok':'no'}" role="status">${f.ok?'Správně!':'Ne tak docela. Správně je '+esc(f.correctAnswer)+'.'}</div>
      <button class="btn" id="nxt" data-act="trn" data-v="1">${f.done?'Výsledek':'Další'}</button></section>`;
  }
  if(T.phase==='done'&&T.summary){
    const m=T.summary;
    const msg=m.tooFast?'Odpovídal(a) jsi příliš rychle, tahle sada se nepočítá. Zkus to a přemýšlej.'
      :m.minutes>0?`+${m.minutes} min na zítra a +${m.xp} XP. Skvělé!`
      :m.capReached?`Dnešních ${m.minutesCap} minut z tréninku máš splněno, XP se ti připsalo. Můžeš trénovat dál.`
      :m.xp>0?`+${m.xp} XP. Na minuty potřebuješ aspoň ${need} správně z ${m.total}.`
      :'Tentokrát bez odměny. Zkus to znovu, jde to!';
    return head+`<section class="panel center"><div class="eyebrow">Výsledek</div><div class="big">${m.correct}<small> z ${m.total}</small></div><p>${esc(msg)}</p>
      <div class="inline" style="justify-content:center"><button class="btn" data-act="trs" data-v="1">Další sada</button><button class="btn ghost" data-act="trm" data-v="1">Zpět</button></div></section>`;
  }
  return head+`<section class="panel center"><p>Dnes hotových sad: ${st.sessionsToday}</p><button class="btn" data-act="trs" data-v="1">Spustit ${st.questions} příkladů</button></section>`;
}

async function loadTrain(){
  T.loading=true;T.err=null;render();
  try{
    const st=await hh.api('/api/me/train');T.status=st;
    if(st.open&&!(T.phase==='q'||T.phase==='fb')){T.session=st.open;T.idx=st.open.answered;T.phase=st.open.answered<st.open.total?'q':'menu'}
  }catch(e){T.err=e.message}
  T.loading=false;render();focusAns();
}
async function trStatus(){try{T.status=await hh.api('/api/me/train')}catch(e){}render()}
function focusAns(){const el=document.getElementById('ans');if(el)el.focus({preventScroll:true})}
async function trainStart(){
  try{const r=await hh.api('/api/me/train/start',{method:'POST',body:{}});T.session=r.session;T.idx=r.session.answered;T.phase='q';T.summary=null;T.fb=null}
  catch(e){toast(e.message)}
  render();focusAns();
}
async function trainAnswer(){
  const el=document.getElementById('ans'),val=el?el.value.trim():'';
  if(!val){toast('Napiš odpověď');return}
  el.disabled=true;
  try{
    const r=await hh.api('/api/me/train/answer',{method:'POST',body:{sessionId:T.session.id,answer:val}});
    T.session.results.push({answer:val,ok:r.ok,correctAnswer:r.correctAnswer});T.fb=r;T.phase='fb';
    if(r.done)T.summary=r.summary;
    if(r.ok&&!r.done){clearTimeout(trTimer);trTimer=setTimeout(()=>{if(T.phase==='fb')trainNext()},900)}
  }catch(e){toast(e.message);if(e.status===404){T.phase='menu';T.session=null;await trStatus();return}if(el)el.disabled=false;return}
  render();const n=document.getElementById('nxt');if(n)n.focus({preventScroll:true});
}
function trainNext(){
  clearTimeout(trTimer);
  if(T.fb&&T.fb.done){T.phase='done';render();load(true);trStatus()}
  else{T.idx++;T.phase='q';T.fb=null;render();focusAns()}
}

/* ---------- historie (záložka Družina) ---------- */
let H=null;
async function loadHist(){try{H=(await hh.api('/api/me/history?days=14')).days}catch(e){H=null}render()}
function histView(){
  if(!H)return '';
  const mx=Math.max(...H.map(d=>d.xpEarned),1);
  const tx=H.reduce((a,d)=>a+d.xpEarned,0),tm=H.reduce((a,d)=>a+d.minutesEarned,0),ms=H.filter(d=>d.missionStatus==='approved').length;
  const rows=[...H].reverse().map(d=>{
    const lab=new Date(d.day+'T12:00:00').toLocaleDateString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'});
    return `<div class="hrow"><span class="hd">${esc(lab)}</span><div class="bar" aria-hidden="true"><i class="ok" style="width:${d.xpEarned/mx*100}%"></i></div><b>${d.xpEarned} XP</b><span class="cap">${d.minutesEarned} min${d.regen?' · regenerace':''}</span></div>`}).join('');
  return `<section class="flat"><div class="eyebrow">Tvých posledních ${H.length} dní</div>
    <div class="stat"><span class="tag ok">${tx} XP</span><span class="tag">${tm} min vyděláno</span><span class="tag">${ms}× večerní mise</span></div>${rows}</section>`;
}

function tabsView(){
  return `<div class="in">${[['home','Domů','home'],['train','Trénink','calc'],['hero','Hrdina','hero'],['team','Družina','group']].map(t=>`<button class="tab" data-act="tab" data-v="${t[0]}" ${S.tab===t[0]?'aria-current="page"':''}>${ic(t[2])}${t[1]}</button>`).join('')}</div>`;
}
function render(){
  if(!S.g)return;
  const k=kid(),st=S.g.state;
  $('#app').innerHTML=topView()+(S.tab==='home'?homeView(k,st):S.tab==='train'?trainView():S.tab==='hero'?heroView(k,st):teamView(k,st)+histView());
  $('#tabs').innerHTML=tabsView();
  $('#hhwho').textContent='Přihlášen: '+S.g.displayName;
  if(S.fk){const el=document.querySelector(`[data-act="${S.fk[0]}"][data-v="${CSS.escape(S.fk[1])}"]`);if(el&&!el.disabled)el.focus({preventScroll:true})}
}

/* level up: porovná s posledním viděným levelem */
function checkLevel(){
  const L=lvlOf(S.g.state.xp),key='hh_lvl_'+S.g.displayName;
  try{const prev=+localStorage.getItem(key);if(prev&&L>prev){const sl=SLOTS.find(x=>x.lvl===L);toast(`Nový level ${L}!${sl?' Odemčeno: '+sl.name+'.':''}${[3,6,10].includes(L)?' Nová forma: '+FORMS[tierOf(L)-1]+'!':''}`)}localStorage.setItem(key,String(L))}catch(e){}
}
async function load(quiet){
  try{S.g=await hh.api('/api/me/game');HHG.setXPT(S.g.levels);checkLevel();if(!(document.activeElement&&document.activeElement.id==='nm')&&!trBusy())render()}
  catch(e){if(e.status===401){location.href='/';return}if(!quiet)$('#app').innerHTML='<p class="cap">'+esc(e.message)+'</p>'}
}
async function act(fn,ok){
  try{const r=await fn();if(r&&r.state)S.g.state=r.state;if(ok)toast(ok)}catch(e){toast(e.message);await load(true)}
  render();
}
const saveHero=(patch)=>{
  const k=kid(),st=S.g.state;
  return hh.api('/api/me/hero',{method:'PUT',body:{hero:k.hero,name:st.hero.name,equipment:{...k.eq},...patch}});
};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!S.g)return;
  const a=b.dataset.act,v=b.dataset.v,k=kid();S.fk=[a,v];
  if(a.startsWith('tr'))S.fk=null;
  if(a==='tab'){S.tab=v;render();if(v==='train')loadTrain();if(v==='team')loadHist()}
  else if(a==='trs')trainStart()
  else if(a==='tra')trainAnswer()
  else if(a==='trn')trainNext()
  else if(a==='trm'){T.phase='menu';render()}
  else if(a==='tick'){const i=+v,cur=S.g.state.mission.items[i];act(()=>hh.api('/api/me/mission',{method:'POST',body:{index:i,checked:!cur}}),null).then(()=>{if(S.g.state.mission.status==='pending')toast('Mise odeslána rodičům ke schválení')})}
  else if(a==='bonus'){act(()=>hh.api('/api/me/bonus',{method:'POST',body:{choreId:v}}),'Odesláno rodičům')}
  else if(a==='pick'){act(()=>saveHero({hero:v}),null)}
  else if(a==='equip'){const[sl,val]=v.split(':');const eq={...k.eq};if(eq[sl]===val)delete eq[sl];else eq[sl]=val;act(()=>saveHero({equipment:eq}),null)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='nm'){S.fk=null;const name=e.target.value.trim();act(()=>saveHero({name:name||null}),'Jméno uloženo')}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||S.tab!=='train')return;
  if(T.phase==='q'&&e.target.id==='ans'){e.preventDefault();trainAnswer()}
  else if(T.phase==='fb'&&e.target.tagName!=='BUTTON'){e.preventDefault();trainNext()}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(true)});
setInterval(()=>{if(document.visibilityState==='visible')load(true)},30000);
load();
})();
</script>
</body>
